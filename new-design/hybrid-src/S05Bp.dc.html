<!doctype html>
<html lang="en">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0b0d10;color:#f4f1ea;font-family:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif}
a{color:#f2b84b}a:hover{color:#e0a030}
.ov{position:absolute;opacity:0;animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:linear;will-change:opacity,transform}
.typed{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;max-width:0;animation-duration:12s;animation-iteration-count:infinite}
.wander{animation:wander 7s ease-in-out infinite}
@keyframes wander{0%,100%{translate:0 0}50%{translate:2px -3px}}
@keyframes ow{0%{opacity:0;transform:translateY(4px)}3.33%{opacity:0;transform:translateY(4px)}6.67%{opacity:1;transform:translateY(0)}18.33%{opacity:1;transform:translateY(0)}21.67%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes kl{0%{opacity:0;transform:translateY(4px)}20.0%{opacity:0;transform:translateY(4px)}23.33%{opacity:1;transform:translateY(0)}31.67%{opacity:1;transform:translateY(0)}35.0%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes ch{0%{opacity:0;transform:translateY(4px)}38.33%{opacity:0;transform:translateY(4px)}41.67%{opacity:1;transform:translateY(0)}75.0%{opacity:1;transform:translateY(0)}78.33%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes pr{0%{opacity:0;transform:translateY(4px)}45.0%{opacity:0;transform:translateY(4px)}48.33%{opacity:1;transform:translateY(0)}78.33%{opacity:1;transform:translateY(0)}81.67%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes ho{0%{opacity:0;transform:translateY(4px)}81.67%{opacity:0;transform:translateY(4px)}85.0%{opacity:1;transform:translateY(0)}95.0%{opacity:1;transform:translateY(0)}99.17%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.ow{animation-name:ow}.kl{animation-name:kl}.ch{animation-name:ch}.pr{animation-name:pr}.ho{animation-name:ho}

@media (prefers-reduced-motion: reduce){.ov,.typed,.wander{animation:none !important;opacity:1 !important;max-width:none !important}.ov.gone{opacity:0 !important}}
</style>
</helmet>
<div id="stage-s05bp" style="position: relative; width: 250px; height: 250px; background: #0b0d10; overflow: visible; --bg0:#0b0d10;--ink1:#f4f1ea;--ink2:#b8b3a8;--ink3:#8a867e;--line1:#2a2d33;--line2:#3a3d44;--amber:#f2b84b;--amber2:#e0a030;--ok:#6fcf97;--alert:#f26d5b;">
  <canvas id="s05bp" width="250" height="250" style="position: absolute; left: 0; top: 0; width: 250px; height: 250px;" role="img" aria-label="One centre cell and six around it; the amber cluster in the centre leaves and the centre goes dark; a new amber cluster lands and draws a pairing line to each cell in turn, each turning amber; the cluster leaves, the lines fade, the six cells stay amber"></canvas>
<div class="ov ch" style="left: 50%; top: 5%; width: 0; display: flex; justify-content: center;"><span style="font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;line-height:1.4; white-space: nowrap; color: var(--amber); font-size:7px;letter-spacing:.5px;">CODEHIVE</span></div><div class="ov ho" style="left: 50%; top: 90%; width: 0; display: flex; justify-content: center;"><span style="font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;line-height:1.4; white-space: nowrap; color: var(--ink1); font-size:7px;letter-spacing:.5px;">the knowledge stays when we leave</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":250,"height":250}}'>

var ENGINE = function(canvas, CFG){
  var W=CFG.W, H=CFG.H, T=CFG.T, N=CFG.N, dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=W*dpr; canvas.height=H*dpr; var ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var cs=getComputedStyle(canvas.parentElement);
  var C={}; ['bg0','ink1','ink2','ink3','line1','line2','amber','amber2','ok','alert'].forEach(function(k){
    var h=cs.getPropertyValue('--'+k).trim(); C[k]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];});
  var rnd=function(a,b){return a+Math.random()*(b-a)};
  var gauss=function(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  // shape generators (px, origin at stage centre)
  var G={
    hex:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++){var e=Math.floor(Math.random()*6),u=Math.random();var a1=(e*60-90)*Math.PI/180,a2=((e+1)*60-90)*Math.PI/180;p.push([cx+R*Math.cos(a1)*(1-u)+R*Math.cos(a2)*u+gauss()*1.2, cy+R*Math.sin(a1)*(1-u)+R*Math.sin(a2)*u+gauss()*1.2]);}return p;},
    rect:function(cx,cy,w,h,n){var p=[];for(var i=0;i<n;i++)p.push([cx+rnd(-w/2,w/2),cy+rnd(-h/2,h/2)]);return p;},
    line:function(x1,y1,x2,y2,n){var p=[];for(var i=0;i<n;i++){var u=(i+Math.random())/n;p.push([x1+(x2-x1)*u+gauss()*1.5,y1+(y2-y1)*u+gauss()*1.5,u]);}return p;},
    cluster:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++)p.push([cx+gauss()*R*0.45,cy+gauss()*R*0.45]);return p;},
    ring:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2;p.push([cx+R*Math.cos(a)+gauss()*2,cy+R*Math.sin(a)+gauss()*2]);}return p;}
  };
  // build particles from regions
  var P=[]; CFG.regions(G).forEach(function(r){ r.pts.forEach(function(q){ P.push({tag:r.tag,hx:q[0],hy:q[1],ox:q[0],oy:q[1],u:q[2]||0,x:q[0],y:q[1],fx:null,fy:null,fs:-9,fd:1,r:[2,3,4][Math.floor(Math.random()*3)],ph:Math.random()*6.283,far:Math.random()<1/16,c:[0,0,0],a:0,sp:rnd(0.8,1.2)}); }); });
  while(P.length<N) P.push({tag:'void',hx:0,hy:0,ox:0,oy:0,x:0,y:0,fs:-9,fd:1,r:2,ph:0,far:false,c:[0,0,0],a:0,sp:1,u:0});
  var moves=CFG.moves?CFG.moves(G):[]; var lastT=-1;
  var ease=function(u){return u<0?0:u>1?1:u*u*(3-2*u)};
  function frame(now){
    var t=(now/1000)%T, dt=lastT<0?0.016:Math.max(0,Math.min(0.05,t-lastT));
    if(t<lastT){ P.forEach(function(p){p.hx=p.ox;p.hy=p.oy;p.fs=-9;}); }
    moves.forEach(function(m){ if(lastT<m.at && t>=m.at){ var k=0; P.forEach(function(p){ if(p.tag===m.tag){ var q=m.to[k%m.to.length]; k++; p.fx=p.hx;p.fy=p.hy;p.hx=q[0];p.hy=q[1];p.fs=t;p.fd=m.dur||1;p.ph2=Math.random();} }); } });
    lastT=t;
    var wave=((t*0.33)%1.5-0.25)*W-W/2;
    ctx.clearRect(0,0,W,H); ctx.lineWidth=1;
    for(var i=0;i<P.length;i++){
      var p=P[i]; if(p.tag==='void')continue;
      var hx=p.hx, hy=p.hy;
      if(CFG.dynamic && CFG.dynamic[p.tag]){ var d=CFG.dynamic[p.tag](t,p); hx=d[0]+p.ox; hy=d[1]+p.oy; }
      var x=hx,y=hy;
      if(p.fs>=0 && t-p.fs<p.fd+0.3){ var u=ease((t-p.fs-p.ph2*0.25)/p.fd); var s=Math.sin(Math.PI*u); x=p.fx+(hx-p.fx)*u+Math.sin(t*7+p.ph)*22*s; y=p.fy+(hy-p.fy)*u+Math.cos(t*5.3+p.ph)*22*s; }
      var ag=1+0.9*Math.exp(-Math.pow((x-wave)/110,2));
      var A=(p.far?8:2.6)*ag, f=p.far?2.2:9*p.sp;
      x+=A*Math.sin(t*f+p.ph); y+=A*Math.cos(t*f*1.27+p.ph*2.1);
      var L=CFG.light(p.tag,t,p,C); var tc=L[0], ta=L[1]; var k=Math.min(1,dt/0.18);
      p.c[0]+=(tc[0]-p.c[0])*k;p.c[1]+=(tc[1]-p.c[1])*k;p.c[2]+=(tc[2]-p.c[2])*k;p.a+=(ta-p.a)*k;
      if(p.a<0.02)continue;
      ctx.strokeStyle='rgba('+(p.c[0]|0)+','+(p.c[1]|0)+','+(p.c[2]|0)+','+p.a.toFixed(2)+')';
      var R=p.r, X=W/2+x, Y=H/2+y; ctx.beginPath();
      ctx.moveTo(X,Y-R); ctx.lineTo(X+R*0.866,Y-R*0.5); ctx.lineTo(X+R*0.866,Y+R*0.5); ctx.lineTo(X,Y+R); ctx.lineTo(X-R*0.866,Y+R*0.5); ctx.lineTo(X-R*0.866,Y-R*0.5); ctx.closePath(); ctx.stroke();
    }
    if(CFG.reduced){ return; }
    canvas.__raf=requestAnimationFrame(frame);
  }
  if(CFG.reduced){ frame(CFG.T*1000-0.001+ (CFG.holdAt||0)*1000); lastT=-1; frame(( (CFG.holdAt||T-1) )*1000); } else canvas.__raf=requestAnimationFrame(frame);
};
var ramp=function(t,a,b){return t<=a?0:t>=b?1:(t-a)/(b-a)};
var mix=function(a,b,u){return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]};

class Component extends DCLogic {
  componentDidMount() { this.boot(); }
  componentWillUnmount() { var c=document.getElementById('s05bp'); if(c&&c.__raf) cancelAnimationFrame(c.__raf); }
  boot() {
    var c=document.getElementById('s05bp'); if(!c){ requestAnimationFrame(()=>this.boot()); return; }
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var CFG = ({
  regions:function(G){ var s=0.3125; var r=[]; r.push({tag:'h0',pts:G.hex(0,0,70*s,82)});
    for(var i=0;i<6;i++){ var a=i*Math.PI/3; var x=175*s*Math.cos(a), y=175*s*Math.sin(a); r.push({tag:'c'+i,pts:G.hex(x,y,70*s,56)}); r.push({tag:'l'+i,pts:G.line(70*s*Math.cos(a),70*s*Math.sin(a),x-70*s*Math.cos(a),y-70*s*Math.sin(a),22)}); }
    r.push({tag:'one',pts:G.cluster(0,0,34*s,56)}); r.push({tag:'ch',pts:G.cluster(0,-620*s,34*s,56)}); return r; },
  moves:function(G){ var s=0.3125; return [{tag:'one',at:2.2,dur:1.2,to:G.cluster(620*s,-520*s,40*s,200)},{tag:'ch',at:4.0,dur:1.0,to:G.cluster(0,0,34*s,200)},{tag:'ch',at:9.0,dur:1.0,to:G.cluster(-640*s,520*s,40*s,200)}]; },
  light:function(tag,t,p,C){ var R=t>=11.4;
    if(tag==='h0'){ if(R||t<0.4) return [C.ink3,0.6]; if(t<2.4) return [C.amber,1]; if(t<4.8) return [C.ink3,0.6]; if(t<9.6) return [C.amber,1]; return [C.ink2,0.8]; }
    if(tag[0]==='c'){ var i=+tag[1]; var t0=5.4+i*0.5; var on=t>=t0+0.4&&!R; return [on?C.amber:C.ink3, on?1:0.55]; }
    if(tag[0]==='l'){ var i=+tag[1]; var t0=5.4+i*0.5; if(R||t<t0) return [C.line2,0]; var u=Math.min(1,(t-t0)/0.4); if(t>=9.6) return [C.line2,0]; return [p.u<=u?C.amber2:C.line2, p.u<=u?0.9:0]; }
    if(tag==='one'){ if(R||t<0.4) return [C.amber2,0]; return [C.amber2, t<2.2?0.9:Math.max(0,0.9-(t-2.2)*0.9)]; }
    if(tag==='ch'){ if(R||t<4.0) return [C.amber,0]; if(t<9.0) return [C.amber,0.95]; return [C.amber,Math.max(0,0.95-(t-9.0)*1.1)]; }
    return [C.line2,0]; }
});
    CFG.W=250; CFG.H=250; CFG.N=900; CFG.T=12; CFG.reduced=reduced;
    ENGINE(c, CFG);
  }
  renderVals() { return {}; }
}
</script>
