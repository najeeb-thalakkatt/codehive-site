<!doctype html>

<title>04 Production and MLOps — swarm + overlay (phone)</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=Schibsted+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0b0d10;color:#f4f1ea;font-family:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif}
a{color:#f2b84b}a:hover{color:#e0a030}
.ov{position:absolute;opacity:0;animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:linear;will-change:opacity,transform}
.typed{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;max-width:0;animation-duration:12s;animation-iteration-count:infinite}
.wander{animation:wander 7s ease-in-out infinite}
@keyframes wander{0%,100%{translate:0 0}50%{translate:2px -3px}}
@keyframes nbl{0%{opacity:0;transform:translateY(4px)}1.67%{opacity:0;transform:translateY(4px)}5.0%{opacity:1;transform:translateY(0)}19.17%{opacity:1;transform:translateY(0)}22.5%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes prb{0%{opacity:0;transform:translateY(4px)}7.5%{opacity:0;transform:translateY(4px)}10.83%{opacity:1;transform:translateY(0)}19.17%{opacity:1;transform:translateY(0)}22.5%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes stg{0%{opacity:0;transform:translateY(4px)}25.0%{opacity:0;transform:translateY(4px)}28.33%{opacity:1;transform:translateY(0)}95.83%{opacity:1;transform:translateY(0)}99.17%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes tf{0%{opacity:0;transform:translateY(4px)}28.33%{opacity:0;transform:translateY(4px)}31.67%{opacity:1;transform:translateY(0)}58.33%{opacity:1;transform:translateY(0)}61.67%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes jwt{0%{opacity:0;transform:translateY(4px)}60.0%{opacity:0;transform:translateY(4px)}63.33%{opacity:1;transform:translateY(0)}95.83%{opacity:1;transform:translateY(0)}99.17%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes cc{0%{opacity:0;transform:translateY(4px)}64.17%{opacity:0;transform:translateY(4px)}67.5%{opacity:1;transform:translateY(0)}95.83%{opacity:1;transform:translateY(0)}99.17%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes tr{0%{opacity:0;transform:translateY(4px)}68.33%{opacity:0;transform:translateY(4px)}71.67%{opacity:1;transform:translateY(0)}95.83%{opacity:1;transform:translateY(0)}99.17%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes ho{0%{opacity:0;transform:translateY(4px)}88.33%{opacity:0;transform:translateY(4px)}91.67%{opacity:1;transform:translateY(0)}95.83%{opacity:1;transform:translateY(0)}99.17%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.nbl{animation-name:nbl}.prb{animation-name:prb}.stg{animation-name:stg}.tf{animation-name:tf}.jwt{animation-name:jwt}.cc{animation-name:cc}.tr{animation-name:tr}.ho{animation-name:ho}

@media (prefers-reduced-motion: reduce){.ov,.typed,.wander{animation:none !important;opacity:1 !important;max-width:none !important}.ov.gone{opacity:0 !important}}
</style>
</helmet>
<div id="stage-sw04p" style="position: relative; width: 350px; height: 220px; background: #0b0d10; overflow: visible; --bg0:#0b0d10;--ink1:#f4f1ea;--ink2:#b8b3a8;--ink3:#8a867e;--line1:#2a2d33;--line2:#3a3d44;--amber:#f2b84b;--amber2:#e0a030;--ok:#6fcf97;--alert:#f26d5b;">
  <canvas id="sw04p" width="350" height="220" style="position: absolute; left: 0; top: 0; width: 350px; height: 220px;" role="img" aria-label="A notebook cluster with three alert specks folds into the first of four hive cells; a packet travels dev, test, prod, monitor and each cell turns green; a door, a ceiling and a trace line appear around prod; a request passes through the door and shows up on the trace"></canvas>
  <div class="ov stg" style="left: 0; top: 70%; width: 100%; height: 14px;"><span style="position:absolute;left:35%;transform:translateX(-50%);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;line-height:1.4; font-size:9px;letter-spacing:0.5px;color:var(--ink2);">dev</span><span style="position:absolute;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;line-height:1.4; font-size:9px;letter-spacing:0.5px;color:var(--ink2);">test</span><span style="position:absolute;left:65%;transform:translateX(-50%);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;line-height:1.4; font-size:9px;letter-spacing:0.5px;color:var(--ink2);">prod</span><span style="position:absolute;left:80%;transform:translateX(-50%);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;line-height:1.4; font-size:9px;letter-spacing:0.5px;color:var(--ink2);">monitor</span></div>
  <div class="ov ho" style="left: 80%; top: 14%; transform: translateX(-50%); font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;line-height:1.4; font-size: 9px; letter-spacing: 0.5px; color: var(--amber);">handover</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":350,"height":220}}'>

var ENGINE = function(canvas, CFG){
  var W=CFG.W, H=CFG.H, T=CFG.T, N=CFG.N, dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=W*dpr; canvas.height=H*dpr; var ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var cs=getComputedStyle(canvas.parentElement);
  var C={}; ['bg0','ink1','ink2','ink3','line1','line2','amber','amber2','ok','alert'].forEach(function(k){
    var h=cs.getPropertyValue('--'+k).trim(); C[k]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];});
  var rnd=function(a,b){return a+Math.random()*(b-a)};
  var gauss=function(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  // shape generators (px, origin at stage centre)
  var G={
    hex:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++){var e=Math.floor(Math.random()*6),u=Math.random();var a1=(e*60-90)*Math.PI/180,a2=((e+1)*60-90)*Math.PI/180;p.push([cx+R*Math.cos(a1)*(1-u)+R*Math.cos(a2)*u+gauss()*1.2, cy+R*Math.sin(a1)*(1-u)+R*Math.sin(a2)*u+gauss()*1.2]);}return p;},
    rect:function(cx,cy,w,h,n){var p=[];for(var i=0;i<n;i++)p.push([cx+rnd(-w/2,w/2),cy+rnd(-h/2,h/2)]);return p;},
    line:function(x1,y1,x2,y2,n){var p=[];for(var i=0;i<n;i++){var u=(i+Math.random())/n;p.push([x1+(x2-x1)*u+gauss()*1.5,y1+(y2-y1)*u+gauss()*1.5,u]);}return p;},
    cluster:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++)p.push([cx+gauss()*R*0.45,cy+gauss()*R*0.45]);return p;},
    ring:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2;p.push([cx+R*Math.cos(a)+gauss()*2,cy+R*Math.sin(a)+gauss()*2]);}return p;}
  };
  // build particles from regions
  var P=[]; CFG.regions(G).forEach(function(r){ r.pts.forEach(function(q){ P.push({tag:r.tag,hx:q[0],hy:q[1],ox:q[0],oy:q[1],u:q[2]||0,x:q[0],y:q[1],fx:null,fy:null,fs:-9,fd:1,r:[2,3,4][Math.floor(Math.random()*3)],ph:Math.random()*6.283,far:Math.random()<1/16,c:[0,0,0],a:0,sp:rnd(0.8,1.2)}); }); });
  while(P.length<N) P.push({tag:'void',hx:0,hy:0,ox:0,oy:0,x:0,y:0,fs:-9,fd:1,r:2,ph:0,far:false,c:[0,0,0],a:0,sp:1,u:0});
  var moves=CFG.moves?CFG.moves(G):[]; var lastT=-1;
  var ease=function(u){return u<0?0:u>1?1:u*u*(3-2*u)};
  function frame(now){
    var t=(now/1000)%T, dt=lastT<0?0.016:Math.max(0,Math.min(0.05,t-lastT));
    if(t<lastT){ P.forEach(function(p){p.hx=p.ox;p.hy=p.oy;p.fs=-9;}); }
    moves.forEach(function(m){ if(lastT<m.at && t>=m.at){ var k=0; P.forEach(function(p){ if(p.tag===m.tag){ var q=m.to[k%m.to.length]; k++; p.fx=p.hx;p.fy=p.hy;p.hx=q[0];p.hy=q[1];p.fs=t;p.fd=m.dur||1;p.ph2=Math.random();} }); } });
    lastT=t;
    var wave=((t*0.33)%1.5-0.25)*W-W/2;
    ctx.clearRect(0,0,W,H); ctx.lineWidth=1;
    for(var i=0;i<P.length;i++){
      var p=P[i]; if(p.tag==='void')continue;
      var hx=p.hx, hy=p.hy;
      if(CFG.dynamic && CFG.dynamic[p.tag]){ var d=CFG.dynamic[p.tag](t,p); hx=d[0]+p.ox; hy=d[1]+p.oy; }
      var x=hx,y=hy;
      if(p.fs>=0 && t-p.fs<p.fd+0.3){ var u=ease((t-p.fs-p.ph2*0.25)/p.fd); var s=Math.sin(Math.PI*u); x=p.fx+(hx-p.fx)*u+Math.sin(t*7+p.ph)*22*s; y=p.fy+(hy-p.fy)*u+Math.cos(t*5.3+p.ph)*22*s; }
      var ag=1+0.9*Math.exp(-Math.pow((x-wave)/110,2));
      var A=(p.far?8:2.6)*ag, f=p.far?2.2:9*p.sp;
      x+=A*Math.sin(t*f+p.ph); y+=A*Math.cos(t*f*1.27+p.ph*2.1);
      var L=CFG.light(p.tag,t,p,C); var tc=L[0], ta=L[1]; var k=Math.min(1,dt/0.18);
      p.c[0]+=(tc[0]-p.c[0])*k;p.c[1]+=(tc[1]-p.c[1])*k;p.c[2]+=(tc[2]-p.c[2])*k;p.a+=(ta-p.a)*k;
      if(p.a<0.02)continue;
      ctx.strokeStyle='rgba('+(p.c[0]|0)+','+(p.c[1]|0)+','+(p.c[2]|0)+','+p.a.toFixed(2)+')';
      var R=p.r, X=W/2+x, Y=H/2+y; ctx.beginPath();
      ctx.moveTo(X,Y-R); ctx.lineTo(X+R*0.866,Y-R*0.5); ctx.lineTo(X+R*0.866,Y+R*0.5); ctx.lineTo(X,Y+R); ctx.lineTo(X-R*0.866,Y+R*0.5); ctx.lineTo(X-R*0.866,Y-R*0.5); ctx.closePath(); ctx.stroke();
    }
    if(CFG.reduced){ return; }
    canvas.__raf=requestAnimationFrame(frame);
  }
  if(CFG.reduced){ frame(CFG.T*1000-0.001+ (CFG.holdAt||0)*1000); lastT=-1; frame(( (CFG.holdAt||T-1) )*1000); } else canvas.__raf=requestAnimationFrame(frame);
};
var ramp=function(t,a,b){return t<=a?0:t>=b?1:(t-a)/(b-a)};
var mix=function(a,b,u){return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]};

class Component extends DCLogic {
  componentDidMount() { this.boot(); }
  componentWillUnmount() { var c=document.getElementById('sw04p'); if(c&&c.__raf) cancelAnimationFrame(c.__raf); }
  boot() {
    var c=document.getElementById('sw04p'); if(!c){ requestAnimationFrame(()=>this.boot()); return; }
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var CFG = ({
  regions:function(G){ var s=0.21875, sy=0.55; var r=[];
    r.push({tag:'nb',pts:G.rect(-560*s,0,180*s,110*sy,187)}); r.push({tag:'nbx',pts:G.cluster(-560*s,0,200*s,45)});
    [-240,0,240,480].forEach(function(x,i){ r.push({tag:'c'+(i+1),pts:G.hex(x*s,0,70*s,63)}); });
    r.push({tag:'k1',pts:G.line(-170*s,0,-70*s,0,33)}); r.push({tag:'k2',pts:G.line(70*s,0,170*s,0,33)}); r.push({tag:'k3',pts:G.line(310*s,0,410*s,0,33)});
    r.push({tag:'door',pts:G.line(150*s,-48*sy,150*s,48*sy,22)}); r.push({tag:'ceil',pts:G.line(180*s,-112*sy,300*s,-112*sy,22)}); r.push({tag:'trace',pts:G.line(180*s,146*sy,560*s,146*sy,30)});
    r.push({tag:'pk',pts:G.cluster(0,0,26*s,33)}); r.push({tag:'rq',pts:G.cluster(0,0,16*s,15)});
    return r; },
  moves:function(G){ var s=0.21875, sy=0.55; return [ {tag:'nb',at:2.5,dur:1.0,to:G.cluster(-240*s,0,54*s,400)}, {tag:'nbx',at:2.6,dur:1.1,to:G.cluster(-240*s,0,40*s,120)} ]; },
  dynamic:{
    pk:function(t){ var s=0.21875; var xs=[-240,0,240,480]; var i=t<4?0:t<5?0:t<6?1:t<7?2:3; var u=t<4?0:t<7?ramp(t,4+i,5+i):1; var sm=u*u*(3-2*u); var x=(xs[i]+(xs[Math.min(3,i+1)]-xs[i])*(t<7?sm:0))*s; return [x,0]; },
    rq:function(t){ var s=0.21875, sy=0.55; var u=ramp(t,9.2,10.4); var sm=u*u*(3-2*u); return [(760-(760-240)*sm)*s, (-70+70*sm)*sy]; }
  },
  light:function(tag,t,p,C){
    var dim=C.line2, R=t>=11.6;
    if(tag==='nb'){ if(R)return[C.ink3,0.85]; if(t<2.5) return [C.ink3,0.85]; return [t<3.6?C.ink2:C.ink3, t<3.6?0.8:0.45]; }
    if(tag==='nbx'){ if(R)return[C.alert,0.6]; if(t<2.5) return [C.alert,0.6]; return [C.ink3,0.5]; }
    if(tag[0]==='c'&&tag.length===2){ var i=+tag[1]-1; if(R||t<2.5) return [dim,0]; var arrive=4+i, leave=5+i; if(t<2.9) return [dim,0.6*ramp(t,2.5,2.9)]; if(t<arrive) return [C.ink3,0.8]; if(t<leave) return [C.amber,1]; if(i===2&&t>=10.2&&t<10.8) return [C.amber,1]; return [C.ok,0.95]; }
    if(tag[0]==='k'){ var i=+tag[1]; if(R||t<2.9) return [dim,0]; var t0=4+i-1+0.6; var u=ramp(t,t0,t0+0.4); return [u>0?C.amber2:C.ink3, 0.75]; }
    if(tag==='door'){ var on=t>=7.2&&!R; var hot=t>=10.0&&t<10.4; return [hot?C.ok:C.ink2, on?0.9:0]; }
    if(tag==='ceil'){ var on=t>=7.7&&!R; return [C.ink2, on?0.9:0]; }
    if(tag==='trace'){ var on=t>=8.2&&!R; var u=ramp(t,10.4,11.0); var lit=on&&t>=10.4&&p.u<=u; return [lit?C.ink1:C.ink2, on?(lit?1:0.7):0]; }
    if(tag==='pk'){ var on=t>=3.9&&t<7.6&&!R; return [C.amber, on?1:0]; }
    if(tag==='rq'){ var on=t>=9.2&&t<10.5&&!R; return [C.ink1, on?1:0]; }
    return [dim,0];
  }
});
    CFG.W=350; CFG.H=220; CFG.N=900; CFG.T=12; CFG.reduced=reduced;
    ENGINE(c, CFG);
  }
  renderVals() { return {}; }
}
</script>
