<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":350,"height":220}}'>

var ENGINE = function(canvas, CFG){
  var W=CFG.W, H=CFG.H, T=CFG.T, N=CFG.N, dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=W*dpr; canvas.height=H*dpr; var ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var cs=getComputedStyle(canvas.parentElement);
  var C={}; ['bg0','ink1','ink2','ink3','line1','line2','amber','amber2','ok','alert'].forEach(function(k){
    var h=cs.getPropertyValue('--'+k).trim(); C[k]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];});
  var rnd=function(a,b){return a+Math.random()*(b-a)};
  var gauss=function(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  // shape generators (px, origin at stage centre)
  var G={
    hex:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++){var e=Math.floor(Math.random()*6),u=Math.random();var a1=(e*60-90)*Math.PI/180,a2=((e+1)*60-90)*Math.PI/180;p.push([cx+R*Math.cos(a1)*(1-u)+R*Math.cos(a2)*u+gauss()*1.2, cy+R*Math.sin(a1)*(1-u)+R*Math.sin(a2)*u+gauss()*1.2]);}return p;},
    rect:function(cx,cy,w,h,n){var p=[];for(var i=0;i<n;i++)p.push([cx+rnd(-w/2,w/2),cy+rnd(-h/2,h/2)]);return p;},
    line:function(x1,y1,x2,y2,n){var p=[];for(var i=0;i<n;i++){var u=(i+Math.random())/n;p.push([x1+(x2-x1)*u+gauss()*1.5,y1+(y2-y1)*u+gauss()*1.5,u]);}return p;},
    cluster:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++)p.push([cx+gauss()*R*0.45,cy+gauss()*R*0.45]);return p;},
    ring:function(cx,cy,R,n){var p=[];for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2;p.push([cx+R*Math.cos(a)+gauss()*2,cy+R*Math.sin(a)+gauss()*2]);}return p;}
  };
  // build particles from regions
  var P=[]; CFG.regions(G).forEach(function(r){ r.pts.forEach(function(q){ P.push({tag:r.tag,hx:q[0],hy:q[1],ox:q[0],oy:q[1],u:q[2]||0,x:q[0],y:q[1],fx:null,fy:null,fs:-9,fd:1,r:[2,3,4][Math.floor(Math.random()*3)],ph:Math.random()*6.283,far:Math.random()<1/16,c:[0,0,0],a:0,sp:rnd(0.8,1.2)}); }); });
  while(P.length<N) P.push({tag:'void',hx:0,hy:0,ox:0,oy:0,x:0,y:0,fs:-9,fd:1,r:2,ph:0,far:false,c:[0,0,0],a:0,sp:1,u:0});
  var moves=CFG.moves?CFG.moves(G):[]; var lastT=-1;
  var ease=function(u){return u<0?0:u>1?1:u*u*(3-2*u)};
  function frame(now){
    var t=(now/1000)%T, dt=lastT<0?0.016:Math.max(0,Math.min(0.05,t-lastT));
    if(t<lastT){ P.forEach(function(p){p.hx=p.ox;p.hy=p.oy;p.fs=-9;}); }
    moves.forEach(function(m){ if(lastT<m.at && t>=m.at){ var k=0; P.forEach(function(p){ if(p.tag===m.tag){ var q=m.to[k%m.to.length]; k++; p.fx=p.hx;p.fy=p.hy;p.hx=q[0];p.hy=q[1];p.fs=t;p.fd=m.dur||1;p.ph2=Math.random();} }); } });
    lastT=t;
    var wave=((t*0.33)%1.5-0.25)*W-W/2;
    ctx.clearRect(0,0,W,H); ctx.lineWidth=1;
    for(var i=0;i<P.length;i++){
      var p=P[i]; if(p.tag==='void')continue;
      var hx=p.hx, hy=p.hy;
      if(CFG.dynamic && CFG.dynamic[p.tag]){ var d=CFG.dynamic[p.tag](t,p); hx=d[0]+p.ox; hy=d[1]+p.oy; }
      var x=hx,y=hy;
      if(p.fs>=0 && t-p.fs<p.fd+0.3){ var u=ease((t-p.fs-p.ph2*0.25)/p.fd); var s=Math.sin(Math.PI*u); x=p.fx+(hx-p.fx)*u+Math.sin(t*7+p.ph)*22*s; y=p.fy+(hy-p.fy)*u+Math.cos(t*5.3+p.ph)*22*s; }
      var ag=1+0.9*Math.exp(-Math.pow((x-wave)/110,2));
      var A=(p.far?8:2.6)*ag, f=p.far?2.2:9*p.sp;
      x+=A*Math.sin(t*f+p.ph); y+=A*Math.cos(t*f*1.27+p.ph*2.1);
      var L=CFG.light(p.tag,t,p,C); var tc=L[0], ta=L[1]; var k=Math.min(1,dt/0.18);
      p.c[0]+=(tc[0]-p.c[0])*k;p.c[1]+=(tc[1]-p.c[1])*k;p.c[2]+=(tc[2]-p.c[2])*k;p.a+=(ta-p.a)*k;
      if(p.a<0.02)continue;
      ctx.strokeStyle='rgba('+(p.c[0]|0)+','+(p.c[1]|0)+','+(p.c[2]|0)+','+p.a.toFixed(2)+')';
      var R=p.r, X=W/2+x, Y=H/2+y; ctx.beginPath();
      ctx.moveTo(X,Y-R); ctx.lineTo(X+R*0.866,Y-R*0.5); ctx.lineTo(X+R*0.866,Y+R*0.5); ctx.lineTo(X,Y+R); ctx.lineTo(X-R*0.866,Y+R*0.5); ctx.lineTo(X-R*0.866,Y-R*0.5); ctx.closePath(); ctx.stroke();
    }
    if(CFG.reduced){ return; }
    canvas.__raf=requestAnimationFrame(frame);
  }
  if(CFG.reduced){ frame(CFG.T*1000-0.001+ (CFG.holdAt||0)*1000); lastT=-1; frame(( (CFG.holdAt||T-1) )*1000); } else canvas.__raf=requestAnimationFrame(frame);
};
var ramp=function(t,a,b){return t<=a?0:t>=b?1:(t-a)/(b-a)};
var mix=function(a,b,u){return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]};

class Component extends DCLogic {
  componentDidMount() { this.boot(); }
  componentWillUnmount() { var c=document.getElementById('s04bp'); if(c&&c.__raf) cancelAnimationFrame(c.__raf); }
  boot() {
    var c=document.getElementById('s04bp'); if(!c){ requestAnimationFrame(()=>this.boot()); return; }
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var CFG = ({
  regions:function(G){ var s=0.21875, sy=0.55; var r=[];
    r.push({tag:'nb',pts:G.rect(-560*s,0,180*s,110*sy,157)}); r.push({tag:'nbx',pts:G.cluster(-560*s,0,200*s,45)});
    [-240,0,240,480].forEach(function(x,i){ r.push({tag:'c'+(i+1),pts:G.hex(x*s,300*sy,70*s,63)}); });
    r.push({tag:'k1',pts:G.line(-170*s,300*sy,-70*s,300*sy,33)}); r.push({tag:'k2',pts:G.line(70*s,300*sy,170*s,300*sy,33)}); r.push({tag:'k3',pts:G.line(310*s,300*sy,410*s,300*sy,33)});
    r.push({tag:'door',pts:G.line(150*s,-48*sy,150*s,48*sy,22)}); r.push({tag:'ceil',pts:G.line(180*s,-112*sy,300*s,-112*sy,22)}); r.push({tag:'trace',pts:G.line(180*s,146*sy,560*s,146*sy,30)});
    r.push({tag:'pk',pts:G.cluster(0,0,26*s,33)}); r.push({tag:'rq',pts:G.cluster(0,0,16*s,15)}); return r; },
  moves:function(G){ var s=0.21875, sy=0.55; var m=[]; [-240,0,240,480].forEach(function(x,i){ m.push({tag:'c'+(i+1),at:2.6+i*0.8,dur:0.9,to:G.hex(x*s,0,70*s,300)}); });
    [[-170,-70],[70,170],[310,410]].forEach(function(l,i){ m.push({tag:'k'+(i+1),at:3.2+i*0.8,dur:0.7,to:G.line(l[0]*s,0,l[1]*s,0,200)}); });
    m.push({tag:'nb',at:2.6,dur:1.2,to:G.rect(-560*s,0,700*s,300*sy,500)}); m.push({tag:'nbx',at:2.6,dur:1.2,to:G.rect(-560*s,0,700*s,300*sy,200)}); return m; },
  dynamic:{
    pk:function(t){ var s=0.21875; var xs=[-240,0,240,480]; var i=t<7?0:t<8?0:t<9?1:t<10?2:3; var u=t<7?0:t<10?ramp(t,7+i,8+i):1; var sm=u*u*(3-2*u); return [(xs[i]+(xs[Math.min(3,i+1)]-xs[i])*(t<10?sm:0))*s,0]; },
    rq:function(t){ var s=0.21875, sy=0.55; var u=ramp(t,10.2,11.0); var sm=u*u*(3-2*u); return [(760-(760-240)*sm)*s,(-70+70*sm)*sy]; }
  },
  light:function(tag,t,p,C){ var dim=C.line2, R=t>=11.6;
    if(tag==='nb'){ if(R||t<2.6) return [C.ink3,0.85]; return [C.ink3, Math.max(0,0.85-(t-2.6)*0.9)]; }
    if(tag==='nbx'){ if(R||t<2.6) return [C.alert,0.6]; return [C.alert, Math.max(0,0.6-(t-2.6)*0.7)]; }
    if(tag[0]==='c'&&tag.length===2){ var i=+tag[1]-1; if(R||t<2.6+i*0.8) return [dim,0]; var arrive=7+i, leave=8+i; if(t<arrive) return [C.ink3,0.85]; if(t<leave) return [C.amber,1]; if(i===2&&t>=10.9&&t<11.3) return [C.amber,1]; return [C.ok,0.95]; }
    if(tag[0]==='k'){ var i=+tag[1]; if(R||t<3.2+(i-1)*0.8) return [dim,0]; var u=ramp(t,7+i-1+0.6,7+i-1+1.0); return [u>0?C.amber2:C.ink3,0.75]; }
    if(tag==='door'){ var on=t>=5.8&&!R; var hot=t>=10.8&&t<11.2; return [hot?C.ok:C.ink2, on?0.9:0]; }
    if(tag==='ceil'){ var on=t>=6.4&&!R; return [C.ink2, on?0.9:0]; }
    if(tag==='trace'){ var on=t>=7.0&&!R; var u=ramp(t,11.0,11.5); var lit=on&&t>=11.0&&p.u<=u; return [lit?C.ink1:C.ink2, on?(lit?1:0.7):0]; }
    if(tag==='pk'){ var on=t>=6.9&&t<10.6&&!R; return [C.amber, on?1:0]; }
    if(tag==='rq'){ var on=t>=10.2&&t<11.1&&!R; return [C.ink1, on?1:0]; }
    return [dim,0]; }
});
    CFG.W=350; CFG.H=220; CFG.N=900; CFG.T=12; CFG.reduced=reduced;
    ENGINE(c, CFG);
  }
  renderVals() { return {}; }
}
